[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-omni-av-understanding-runtime"
version = "0.1.0"
description = "Standalone Skill runtime for Chinese audio/video understanding"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "requests-toolbelt>=1,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8", "pyyaml>=6"]

[tool.setuptools]
packages = []
